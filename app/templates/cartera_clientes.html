<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cartera">
    <link rel="manifest" href="/manifest.json">
    <title>Cartera de Clientes</title>
    <style>
        :root {
            --ink: #111827;
            --muted: #64748b;
            --line: #e5e7eb;
            --card: #0f172a;
            --danger: #ef4444;
            --risk: #ea580c;
            --ok: #059669;
            --bar: rgba(255, 255, 255, 0.92);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #e7ebf0;
            color: var(--ink);
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        .shell {
            width: min(480px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            background: #f8fafc;
            position: relative;
            box-shadow: 0 0 40px rgba(15, 23, 42, 0.06);
        }
        button, input, select { font: inherit; }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
            background: rgba(248, 250, 252, 0.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 12px;
            background: #e8edf3;
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .icon-btn.blue { background: #2563eb; color: #fff; }
        .brand {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
        }
        .brand strong {
            font-size: 15px;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather {
            min-width: 52px;
            height: 40px;
            padding: 0 10px;
            border-radius: 12px;
            background: #2b2b2b;
            color: #fff;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .page {
            padding: 18px 16px calc(132px + env(safe-area-inset-bottom, 0px));
        }
        h1 {
            margin: 0 0 14px;
            font-size: 1.7rem;
            letter-spacing: -0.03em;
        }
        .tools {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tools input, .tools select {
            width: 100%;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 0 14px;
            outline: none;
        }
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 14px;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            border: 1px solid var(--line);
            background: #fff;
            color: #475569;
            border-radius: 999px;
            padding: 8px 12px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
        }
        .chip.active { background: #111827; color: #fff; border-color: #111827; }
        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .debt-card {
            background: linear-gradient(160deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 22px;
            padding: 18px 18px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 16px 30px -18px rgba(15, 23, 42, 0.7);
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .card-top, .card-foot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }
        .who { display: flex; gap: 12px; min-width: 0; }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .who h2 {
            margin: 0;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        .pill {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.1);
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .late {
            background: #ffe4e6;
            color: #e11d48;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 800;
            line-height: 1.15;
            text-align: center;
            flex: none;
        }
        .late.ok { background: #dcfce7; color: #15803d; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 16px 0 14px;
            padding: 14px 12px;
            border-radius: 16px;
            background: rgba(0,0,0,0.22);
        }
        .metrics span { display: block; color: #94a3b8; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
        .metrics strong { display: block; margin-top: 4px; font-size: 15px; font-weight: 650; }
        .card-foot { align-items: flex-end; padding-top: 8px; }
        .amount-label { color: #94a3b8; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
        .amount { display: block; margin-top: 2px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.04em; }
        .amount.hot { color: #fecaca; }
        .amount.cool { color: #86efac; }
        .foot-note { color: #94a3b8; font-size: 12px; text-align: right; line-height: 1.35; }
        .empty {
            padding: 48px 12px;
            text-align: center;
            color: var(--muted);
        }
        .bar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: min(456px, calc(100% - 24px));
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 14px 6px 12px;
            border-radius: 22px;
            background: var(--bar);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }
        .bar button {
            border: 0;
            background: transparent;
            padding: 2px 2px;
            cursor: pointer;
            min-width: 0;
        }
        .bar button.on { background: rgba(15, 23, 42, 0.05); border-radius: 14px; }
        .bar small {
            display: block;
            color: #64748b;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }
        .bar b {
            display: block;
            margin-top: 3px;
            font-size: 0.95rem;
            letter-spacing: -0.03em;
            color: #0f172a;
        }
        .bar .sub {
            display: block;
            margin-top: 2px;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 650;
        }
        #barDeuda { color: var(--risk); }
        #barRiesgo { color: var(--danger); }
        #barCobros { color: var(--ok); }
        .sheet-back {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            z-index: 40;
        }
        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 41;
            background: #fff;
            border-radius: 24px 24px 0 0;
            padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
            box-shadow: 0 -16px 40px rgba(15, 23, 42, 0.16);
        }
        .sheet h3 { margin: 0 0 4px; font-size: 1.25rem; }
        .sheet p { margin: 0 0 14px; color: var(--muted); }
        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .fact {
            background: #f8fafc;
            border-radius: 14px;
            padding: 10px 12px;
        }
        .fact span { display: block; color: #94a3b8; font-size: 11px; font-weight: 700; }
        .fact strong { display: block; margin-top: 2px; }
        .sheet.historial {
            top: 10px;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            width: min(1120px, calc(100% - 12px));
            bottom: 10px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .hist-head, .hist-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
        }
        .hist-head { border-bottom: 1px solid #e5e7eb; }
        .hist-head h3 { margin: 0; font-size: 1rem; }
        .hist-close {
            margin-left: auto;
            border: 0;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
        }
        .hist-who { padding: 10px 14px 0; font-weight: 800; }
        .hist-who span { font-weight: 600; color: #64748b; font-size: 13px; }
        .hist-scroll { overflow: auto; flex: 1; }
        .hist-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
        .hist-table th {
            position: sticky; top: 0; background: #f1f5f9; color: #334155;
            font-size: 11px; text-align: left; padding: 10px 8px;
        }
        .hist-table td { padding: 10px 8px; border-top: 1px solid #eef2f7; white-space: nowrap; }
        .hist-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .venta { color: #dc2626; font-weight: 700; }
        .cobro { color: #047857; font-weight: 700; }
        .cobro-row td { background: #ecfdf5; }
        .dias-mora { color: #d97706; font-weight: 800; }
        .mant { color: #b45309; font-weight: 700; }
        .hist-foot { border-top: 1px solid #e5e7eb; flex-wrap: wrap; }
        .hist-foot p { margin: 0; color: #64748b; font-size: 12px; font-weight: 700; flex: 1; }
        .badge-mant, .badge-total {
            border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 13px;
        }
        .badge-mant { background: #fef3c7; color: #92400e; }
        .badge-total { background: #fef2f2; color: #dc2626; border: 2px solid #fecaca; }
        .sheet-close {
            margin-top: 14px;
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 14px;
            background: #111827;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <button class="icon-btn" type="button" onclick="location.href='/'" aria-label="Volver">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand">
            <span id="diaIcon" aria-hidden="true">☀️</span>
            <strong id="empresaNombre">CARTERA</strong>
        </div>
        <span class="weather" id="clima">--°</span>
        <button class="icon-btn blue" type="button" onclick="loadClients()" aria-label="Actualizar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
    </header>

    <main class="page">
        <h1>Cartera</h1>
        <div class="tools">
            <input id="searchInput" type="search" placeholder="Buscar nombre o DNI" oninput="filterClients()">
            <select id="sucursalFiltro" onchange="elegirSucursal()">
                <option value="">Todas las sucursales</option>
            </select>
        </div>
        <div class="chips" id="filterTabs">
            <button class="chip active" data-filter="all" type="button">Todos <span id="countAll">0</span></button>
            <button class="chip" data-filter="saldo" type="button">Con deuda <span id="countSaldo">0</span></button>
            <button class="chip" data-filter="criticos" type="button">Riesgo <span id="countCriticos">0</span></button>
            <button class="chip" data-filter="al_dia" type="button">Al día <span id="countAlDia">0</span></button>
            <button class="chip" data-filter="expres" type="button">Express <span id="countExpress">0</span></button>
            <button class="chip" data-filter="30+" type="button">30+ <span id="count30">0</span></button>
            <button class="chip" data-filter="60+" type="button">60+ <span id="count60">0</span></button>
            <button class="chip" data-filter="90+" type="button">90+ <span id="count90">0</span></button>
        </div>
        <div class="cards" id="cards"></div>
        <div class="empty" id="emptyState">Cargando el libro…</div>
    </main>

    <nav class="bar" aria-label="Resumen de cartera">
        <button type="button" data-filter="saldo" id="goDeuda">
            <small>EN LA CALLE</small>
            <b id="barDeuda">$0</b>
            <span class="sub" id="barDeudaSub">0 activas</span>
        </button>
        <button type="button" data-filter="criticos" id="goRiesgo">
            <small>EN RIESGO</small>
            <b id="barRiesgo">$0</b>
            <span class="sub" id="barRiesgoSub">0 cuentas</span>
        </button>
        <button type="button" id="goCobros">
            <small>COBROS</small>
            <b id="barCobros">$0</b>
            <span class="sub">del mes</span>
        </button>
        <button type="button" data-filter="all" id="goClientes">
            <small>ACTIVAS</small>
            <b id="barClientes">0</b>
            <span class="sub" id="barClientesSub">con deuda</span>
        </button>
    </nav>

    <div id="sheetHost" hidden></div>
</div>

    <script>
        const API_BASE = '/api';
        const CACHE_CARTERA = 'crm-cartera-app';
        let allClients = [];
        let currentFilter = 'all';
        let cobrosMes = 0;
        let libro = {};
        let sucursalId = '';

        function formatCents(amount) {
            return new Intl.NumberFormat('es-AR', {
                style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2
            }).format(Number(amount) || 0);
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('es-AR', {
                style: 'currency', currency: 'ARS', maximumFractionDigits: 0
            }).format(Number(amount) || 0);
        }

        function formatCompact(amount) {
            const n = Number(amount) || 0;
            const sign = n < 0 ? '-' : '';
            const abs = Math.abs(n);
            if (abs >= 1000000) {
                const millions = (abs / 1000000).toFixed(abs >= 10000000 ? 1 : 1).replace('.', ',');
                return sign + '$' + millions + 'M';
            }
            return sign + formatMoney(abs);
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function deudaVisible(client) {
            if (client.deuda_pos != null && client.deuda_pos !== '') return Number(client.deuda_pos) || 0;
            const saldo = Number(client.saldo_actual);
            return Number.isFinite(saldo) ? saldo : 0;
        }

        function diasDe(client) {
            if (client.dias != null && client.dias !== '') return Number(client.dias);
            return calculateDaysSincePayment(client.fecha_ultimo_pago);
        }

        function esExpress(client) {
            const tipo = String(client.tipo_cliente || '').toLowerCase();
            return tipo.includes('express') || tipo.includes('expres');
        }

        const TASA_BASE = 5;
        const TASA_APAL = 5;
        const PLAZO_BASE = 30;

        function calculateDaysSincePayment(fechaUltimoPago) {
            if (!fechaUltimoPago) return null;
            const lastPayment = new Date(fechaUltimoPago);
            if (Number.isNaN(lastPayment.getTime())) return null;
            const diffTime = Date.now() - lastPayment.getTime();
            if (diffTime < 0) return 0;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        function getClientStatus(cliente) {
            if (cliente.en_riesgo) return { label: 'Atención', class: 'hot' };
            if (deudaVisible(cliente) <= 0) return { label: 'Al día', class: 'ok' };
            return { label: cliente.estado || 'Regular', class: '' };
        }

        function enRiesgo(client) {
            return !!client.en_riesgo;
        }

        function interesCuenta(client) {
            const monto = Number(client.mantenimiento) || 0;
            return { monto, real: client.mantenimiento_origen === 'libro' };
        }

        function sucursalDe(client) {
            return client.sucursal_nombre || 'Sin sucursal';
        }

        function clientesDeSucursal() {
            return allClients;
        }

        function elegirSucursal() {
            sucursalId = document.getElementById('sucursalFiltro').value;
            loadClients();
        }

        function llenarSucursales(lista) {
            const select = document.getElementById('sucursalFiltro');
            const previa = String(sucursalId || '');
            const opciones = (lista || []).map(item => `<option value="${esc(item.id)}">${esc(item.nombre)}</option>`).join('');
            select.innerHTML = '<option value="">Todas las sucursales</option>' + opciones;
            if ([...select.options].some(opcion => opcion.value === previa)) select.value = previa;
        }

        function desdeLibro(cliente) {
            return {
                id: cliente.id,
                pos_id: cliente.id,
                nombre: cliente.nombre,
                cuit: cliente.dni,
                telefono: cliente.telefono,
                tipo_cliente: cliente.tipo,
                deuda_pos: cliente.deuda,
                techo_deuda: cliente.limite,
                dias: cliente.dias,
                mantenimiento: cliente.mantenimiento,
                mantenimiento_origen: cliente.mantenimiento_origen,
                tarifa: cliente.tarifa,
                en_riesgo: cliente.en_riesgo,
                estado: cliente.estado,
                sucursal_nombre: cliente.sucursal_nombre || ''
            };
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.chip').forEach(item => {
                item.classList.toggle('active', item.dataset.filter === filter);
            });
            document.querySelectorAll('.bar button').forEach(item => {
                item.classList.toggle('on', item.dataset.filter === filter);
            });
            filterClients();
        }

        function filterClients() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const filtered = clientesDeSucursal().filter(client => {
                const matchesSearch = !searchQuery ||
                    (client.nombre && client.nombre.toLowerCase().includes(searchQuery)) ||
                    (client.cuit && String(client.cuit).toLowerCase().includes(searchQuery));
                const saldo = deudaVisible(client);
                const days = diasDe(client);
                let matchesCategory = true;
                switch (currentFilter) {
                    case 'saldo': matchesCategory = saldo > 0; break;
                    case 'al_dia': matchesCategory = saldo <= 0; break;
                    case 'expres': matchesCategory = esExpress(client); break;
                    case 'criticos': matchesCategory = enRiesgo(client); break;
                    case '30+': matchesCategory = days !== null && days >= 30; break;
                    case '60+': matchesCategory = days !== null && days >= 60; break;
                    case '90+': matchesCategory = days !== null && days >= 90; break;
                }
                return matchesSearch && matchesCategory;
            });
            filtered.sort((a, b) => deudaVisible(b) - deudaVisible(a));
            renderCards(filtered);
        }

        function renderCards(clients) {
            const box = document.getElementById('cards');
            const emptyState = document.getElementById('emptyState');
            if (!clients.length) {
                box.innerHTML = '';
                emptyState.hidden = false;
                emptyState.textContent = 'No hay clientes en este filtro.';
                return;
            }
            emptyState.hidden = true;
            box.innerHTML = clients.map(client => {
                const saldo = deudaVisible(client);
                const interes = interesCuenta(client);
                const total = saldo + interes.monto;
                const tipo = esExpress(client) ? 'EXPRESS' : String(client.tipo_cliente || 'CLIENTE').replaceAll('_', ' ').toUpperCase();
                const interesTxt = interes.real ? formatCompact(interes.monto) : ('est. ' + formatCompact(interes.monto));
                const late = client.dias == null
                    ? '<span class="late">Sin días<br>en el libro</span>'
                    : (Number(client.dias) > 0
                        ? `<span class="late">${esc(client.dias)} días<br>retraso</span>`
                        : '<span class="late ok">Al día</span>');
                const pie = [client.cuit ? 'DNI ' + client.cuit : '', client.telefono || ''].filter(Boolean).join(' · ') || 'Ver historial';
                return `
                    <article class="debt-card" data-id="${esc(client.id)}">
                        <div class="card-top">
                            <div class="who">
                                <div class="avatar" aria-hidden="true">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="1.8"><path d="M20 21a8 8 0 10-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                                </div>
                                <div>
                                    <h2>${esc(client.nombre)}</h2>
                                    <span class="pill">${esc(tipo)}</span>
                                </div>
                            </div>
                            ${late}
                        </div>
                        <div class="metrics">
                            <div><span>CAPITAL</span><strong>${formatCompact(saldo)}</strong></div>
                            <div><span>INTERÉS</span><strong>${interesTxt}</strong></div>
                            <div><span>CFR</span><strong>${esc(client.tarifa || '—')}</strong></div>
                        </div>
                        <div class="card-foot">
                            <div>
                                <span class="amount-label">TOTAL A PAGAR</span>
                                <span class="amount ${saldo > 0 ? 'hot' : 'cool'}">${formatCompact(total)}</span>
                            </div>
                            <div class="foot-note">${esc(pie)}</div>
                        </div>
                    </article>`;
            }).join('');
        }

        function updateMetrics() {
            const base = clientesDeSucursal();
            const conDeuda = base.filter(c => deudaVisible(c) > 0);
            const riesgo = base.filter(enRiesgo);
            const deuda = conDeuda.reduce((sum, c) => sum + deudaVisible(c), 0);
            const deudaRiesgo = riesgo.reduce((sum, c) => sum + Math.max(deudaVisible(c), 0), 0);
            document.getElementById('barDeuda').textContent = formatCompact(libro.cartera_en_calle != null ? libro.cartera_en_calle : deuda);
            document.getElementById('barDeudaSub').textContent = `${libro.cuentas_activas != null ? libro.cuentas_activas : conDeuda.length} activas`;
            document.getElementById('barRiesgo').textContent = formatCompact(libro.cartera_en_riesgo != null ? libro.cartera_en_riesgo : deudaRiesgo);
            document.getElementById('barRiesgoSub').textContent = `${libro.cuentas_en_riesgo != null ? libro.cuentas_en_riesgo : riesgo.length} cuentas`;
            document.getElementById('barCobros').textContent = formatCompact(libro.cobros_del_mes != null ? libro.cobros_del_mes : cobrosMes);
            document.getElementById('barClientes').textContent = String(libro.cuentas_activas != null ? libro.cuentas_activas : conDeuda.length);
            document.getElementById('barClientesSub').textContent = 'con deuda';
            document.getElementById('countAll').textContent = base.length;
            document.getElementById('countSaldo').textContent = conDeuda.length;
            document.getElementById('countAlDia').textContent = base.filter(c => deudaVisible(c) <= 0).length;
            document.getElementById('countExpress').textContent = base.filter(esExpress).length;
            document.getElementById('countCriticos').textContent = riesgo.length;
            document.getElementById('count30').textContent = base.filter(c => {
                const days = diasDe(c);
                return days !== null && days >= 30;
            }).length;
            document.getElementById('count60').textContent = base.filter(c => {
                const days = diasDe(c);
                return days !== null && days >= 60;
            }).length;
            document.getElementById('count90').textContent = base.filter(c => {
                const days = diasDe(c);
                return days !== null && days >= 90;
            }).length;
        }

        function formatPos(amount) {
            const n = Number(amount) || 0;
            const sign = n < 0 ? '-' : '';
            return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function filaHistorial(fila) {
            const clase = fila.es_cobro ? 'cobro' : (fila.es_venta ? 'venta' : '');
            const dias = fila.dias == null ? '—' : `${fila.dias} d`;
            const mant = fila.es_interes ? 'Asentado' : (fila.mantenimiento == null ? '—' : formatPos(fila.mantenimiento));
            return `<tr class="${fila.es_cobro ? 'cobro-row' : ''}">
                <td>${esc(fila.fecha)}</td>
                <td class="${clase}">${esc(fila.etiqueta)}</td>
                <td class="num ${clase}">${formatPos(fila.monto)}</td>
                <td class="num">${formatPos(fila.saldo)}</td>
                <td>${esc(fila.ticket)}</td>
                <td>${esc(fila.detalle)}</td>
                <td class="${fila.dias > 30 ? 'dias-mora' : ''}">${dias}</td>
                <td class="num ${fila.mantenimiento > 0 ? 'mant' : ''}">${mant}</td>
            </tr>`;
        }

        async function abrirFicha(id) {
            const client = allClients.find(item => String(item.id) === String(id));
            if (!client) return;
            const host = document.getElementById('sheetHost');
            host.hidden = false;
            host.innerHTML = `
                <div class="sheet-back" data-close="1"></div>
                <section class="sheet historial" role="dialog" aria-modal="true">
                    <div class="hist-head"><h3>Historial del cliente</h3><button class="hist-close" type="button" data-close="1" aria-label="Cerrar">×</button></div>
                    <div class="hist-who">${esc(client.nombre)} <span>${esc(client.tipo_cliente || 'regular')}</span></div>
                    <div class="hist-scroll"><p style="padding:16px;color:#64748b">Cargando el libro…</p></div>
                </section>`;
            if (client.pos_id == null) {
                host.querySelector('.hist-scroll').innerHTML = '<p style="padding:16px;color:#64748b">Esta cuenta todavía no tiene el libro de Cobro Fácil.</p>';
                return;
            }
            try {
                const dato = await fetch(`${API_BASE}/pos/historial?pos_id=${encodeURIComponent(client.pos_id)}&deuda=${encodeURIComponent(deudaVisible(client))}`).then(r => r.json());
                const movs = dato.movimientos || [];
                if (!movs.length) {
                    host.querySelector('.hist-scroll').innerHTML = '<p style="padding:16px;color:#64748b">El libro de esta cuenta todavía no llegó a la nube.</p>';
                    return;
                }
                host.querySelector('.historial').insertAdjacentHTML('beforeend', `
                    <div class="hist-foot">
                        <p>${esc(dato.resumen || '')}</p>
                        <span class="badge-mant">Mantenimiento: +${formatPos(dato.mantenimiento)}</span>
                        <span class="badge-total">TOTAL ESTIMADO: ${formatPos(dato.total_estimado)}</span>
                    </div>`);
                host.querySelector('.hist-scroll').innerHTML = `
                    <table class="hist-table">
                        <thead><tr>
                            <th>Fecha</th><th>Tipo</th><th>Monto</th><th>Saldo</th>
                            <th>Ticket / cobro</th><th>Descripción</th><th>Días</th><th>Mantenimiento</th>
                        </tr></thead>
                        <tbody>${movs.map(filaHistorial).join('')}</tbody>
                    </table>`;
            } catch (_) {
                host.querySelector('.hist-scroll').innerHTML = '<p style="padding:16px;color:#64748b">No se pudo leer el historial.</p>';
            }
        }

        function cerrarFicha() {
            const host = document.getElementById('sheetHost');
            host.hidden = true;
            host.innerHTML = '';
        }

        function aplicarLibro(dato) {
            const cartera = (dato && dato.cartera) || {};
            libro = cartera;
            cobrosMes = Number(cartera.cobros_del_mes) || 0;
            allClients = (cartera.clientes || cartera.top_deudores || []).map(desdeLibro);
            llenarSucursales(dato.sucursales || []);
            updateMetrics();
            filterClients();
        }

        async function loadClients() {
            const vacio = document.getElementById('emptyState');
            if (!allClients.length && vacio) {
                vacio.hidden = false;
                vacio.textContent = 'Cargando el libro…';
            }
            try {
                let url = `${API_BASE}/pos/jefe?panel=admin`;
                if (sucursalId) url += '&sucursal_id=' + encodeURIComponent(sucursalId);
                const response = await fetch(url);
                if (!response.ok) throw new Error('libro');
                const dato = await response.json();
                try { sessionStorage.setItem(CACHE_CARTERA, JSON.stringify(dato)); } catch (e) {}
                aplicarLibro(dato);
            } catch (e) {
                if (!allClients.length && vacio) {
                    vacio.hidden = false;
                    vacio.textContent = 'El libro no llegó. Tocá actualizar.';
                }
            }
        }

        document.getElementById('filterTabs').addEventListener('click', (event) => {
            const tab = event.target.closest('.chip');
            if (!tab) return;
            setFilter(tab.dataset.filter);
        });
        document.querySelector('.bar').addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button || !button.dataset.filter) return;
            setFilter(button.dataset.filter);
        });
        document.getElementById('cards').addEventListener('click', (event) => {
            const card = event.target.closest('.debt-card');
            if (card) abrirFicha(card.dataset.id);
        });
        document.getElementById('sheetHost').addEventListener('click', (event) => {
            if (event.target.closest('[data-close]')) cerrarFicha();
        });

        async function cargarMarca() {
            try {
                const data = await fetch('/auth/session').then(r => r.ok ? r.json() : null);
                const nombre = (data && data.empresa_nombre) || '';
                if (nombre) document.getElementById('empresaNombre').textContent = nombre.toUpperCase();
            } catch (_) {}
            const hora = new Date().getHours();
            document.getElementById('diaIcon').textContent = hora >= 19 || hora < 7 ? '🌙' : '☀️';
        }

        function cargarClima() {
            const pintar = (lat, lon) => {
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                    .then(r => r.json())
                    .then(data => {
                        const temp = data.current_weather && data.current_weather.temperature;
                        if (Number.isFinite(temp)) document.getElementById('clima').textContent = Math.round(temp) + '°';
                    })
                    .catch(() => {});
            };
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => pintar(pos.coords.latitude, pos.coords.longitude),
                    () => pintar(-32.45, -60.88),
                    { timeout: 4000 }
                );
            } else {
                pintar(-32.45, -60.88);
            }
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
        try {
            const previo = sessionStorage.getItem(CACHE_CARTERA);
            if (previo) aplicarLibro(JSON.parse(previo));
        } catch (e) {}
        cargarMarca();
        cargarClima();
        loadClients();
    </script>
</body>
</html>
