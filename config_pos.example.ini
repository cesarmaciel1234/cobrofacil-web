[INTEGRACION_POS]
# Configuración de integración con servidor POS (TPV Pro 2026)

# URL del servidor POS (ej: http://192.168.1.100:5000)
server_url = http://localhost:5000

# Clave API para autenticación con el servidor POS
api_key = tu_clave_api_aqui

# Intervalo de sincronización automática en minutos
sync_interval_minutes = 30

# Activar sincronización automática (0 = desactivado, 1 = activado)
auto_sync = 0

[DATABASE]
# Ruta de la base de datos local (si se usa SQLite)
# Dejar vacío para usar la base de datos por defecto
db_path =

[LOG]
# Nivel de logging: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Archivo de log (dejar vacío para log a consola)
log_file = crm_pos.log
